<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../assets/css/ecare-style.css">
<style>body{margin:0;padding:24px;background:#F8FAFC;font-family:system-ui,sans-serif}</style></head><body>
<!-- The markup ECare_Shortcodes::render_caregiver_registration() emits for the
     two password fields. Kept in step with that function by hand; if the two
     drift, this test stops meaning anything. -->
<form id="ecare-caregiver-registration-form" class="ecare-form ecare-form-registration">
  <div class="ecare-form-row">
    <div class="ecare-form-field">
      <label>Password <span>*</span></label>
      <div class="ecare-password-wrap">
        <input type="password" name="password" placeholder="••••••••" required />
        <button type="button" class="ecare-password-toggle" aria-pressed="false" aria-label="Show password" title="Show password">
          <svg class="ecare-eye ecare-eye-show" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          <svg class="ecare-eye ecare-eye-hide" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false" hidden><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
        </button>
      </div>
    </div>
    <div class="ecare-form-field">
      <label>Confirm Password <span>*</span></label>
      <div class="ecare-password-wrap">
        <input type="password" name="confirm_password" placeholder="••••••••" required />
        <button type="button" class="ecare-password-toggle" aria-pressed="false" aria-label="Show password" title="Show password">
          <svg class="ecare-eye ecare-eye-show" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          <svg class="ecare-eye ecare-eye-hide" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false" hidden><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
        </button>
      </div>
    </div>
  </div>
</form>
<p id="submitted" hidden>FORM SUBMITTED</p>
<script>
  // The form must never actually submit; a toggle button that does is the
  // classic bug this page exists to catch.
  document.getElementById('ecare-caregiver-registration-form')
    .addEventListener('submit', function (e) { e.preventDefault(); document.getElementById('submitted').hidden = false; });
</script>
<!-- jQuery from the WordPress install this plugin lives in, so the page needs
     no network. Then the real script, with the globals it expects. -->
<script src="../../../../../wp-includes/js/jquery/jquery.min.js"></script>
<script>
  window.ecare_ajax = { ajax_url: '/wp-admin/admin-ajax.php', nonce: 'test' };
  if (window.jQuery) { jQuery.fn.select2 = function () { return this; }; }
</script>
<script src="../../assets/js/ecare-script.js"></script>
</body></html>
