<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../assets/css/ecare-style.css">
<style>body{margin:0}</style></head><body>
<!-- Same classes and structure ECare_Ajax::get_caregiver_details() now emits. -->
<div id="ecare-create-family-modal" style="display:flex; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); z-index:100000; justify-content:center; align-items:center;">
  <div class="ecare-family-modal-box">
    <h3>Create Family Member</h3>
    <form id="ecare-create-family-form">
      <div class="ecare-family-form-grid">
        <div><label>Name *</label><input type="text" name="member_name" style="width:100%;padding:8px;box-sizing:border-box;" /></div>
        <div><label>Mobile</label><input type="text" name="member_phone" style="width:100%;padding:8px;box-sizing:border-box;" /></div>
        <div><label>Email</label><input type="email" name="member_email" style="width:100%;padding:8px;box-sizing:border-box;" /></div>
        <div><label>Gender *</label><select name="member_gender" style="width:100%;padding:8px;box-sizing:border-box;"><option>Select Gender</option></select></div>
        <div class="ecare-family-field-wide"><label>Date of Birth *</label>
          <div class="ecare-family-dob-row">
            <select name="member_dob_year" style="padding:6px;box-sizing:border-box;"><option>Year</option><option>1995</option></select>
            <select name="member_dob_month" style="padding:6px;box-sizing:border-box;"><option>Month</option><option>Aug</option></select>
            <select name="member_dob_day" style="padding:6px;box-sizing:border-box;"><option>Day</option><option>30</option></select>
          </div>
        </div>
        <div><label>Relationship *</label><select name="member_relation" style="width:100%;padding:8px;box-sizing:border-box;"><option>Select relationship</option></select></div>
        <div><label>Weight (kg)</label><input type="number" name="member_weight" style="width:100%;padding:8px;box-sizing:border-box;" /></div>
        <div><label>Height (Feet and Inches)</label>
          <div class="ecare-family-height-row">
            <input type="number" name="member_height_ft" placeholder="Feet" style="padding:8px;box-sizing:border-box;" />
            <input type="number" name="member_height_in" placeholder="Inches" style="padding:8px;box-sizing:border-box;" />
          </div>
        </div>
      </div>
      <button type="submit">Add Member</button>
    </form>
  </div>
</div>
</body></html>
